name: Build & Release SPICA.exe

# Triggers when a tag matching v* is pushed (e.g. v1.0.0, v2.3.1)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create GitHub Release and upload assets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      # ── 3. Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Build with PyInstaller
      - name: Build SPICA.exe
        run: pyinstaller SPICA.spec

      # ── 5. Zip the output directory
      - name: Zip dist/SPICA
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path dist\SPICA\* -DestinationPath "SPICA-$tag-windows.zip"

      # ── 6. Create GitHub Release and upload the zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SPICA ${{ github.ref_name }}"
          body: |
            ## SPICA — Spice Parallel Instance Circuit Analyzer

            ### Installation
            1. Download `SPICA-${{ github.ref_name }}-windows.zip`
            2. Extract to any folder
            3. Run `SPICA.exe`

            LTSpice 24 must be installed separately.
          files: SPICA-${{ github.ref_name }}-windows.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
