name: Build & Release SPICA.exe

# Triggers when a tag matching v* is pushed (e.g. v0.1.0)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Release and upload assets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # net48 WinForms app: the whole program is a single SPICA.exe
      - name: Build SPICA.exe
        run: dotnet build src/SPICA/SPICA.csproj -c Release -o out

      - name: Build smoke tests
        run: dotnet build tests/SPICA.Smoke/SPICA.Smoke.csproj -c Release

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "SPICA ${{ github.ref_name }}"
          body: |
            ## SPICA — Spice Parallel Instancer Circuit Analysis

            Download `SPICA.exe` and run it. No installation needed — it is the whole app.
            Settings (`SPICA.ini`) and profiles (`SPICA.profiles`) are written next to the exe.

            Requires Windows with .NET Framework 4.8 (built into Windows 10/11) and LTspice installed.
          files: out/SPICA.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
